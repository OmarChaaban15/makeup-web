<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Makeup by Yona – Realiza tu belleza · Enhance your beauty</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Makeup by Yona – Artista de maquillaje profesional en Ibiza. Servicios de novias, eventos, cursos y masterclasses.">
  <link rel="icon" type="image/png" href="logo/my_logo.png">
  <link rel="alternate icon" type="image/svg+xml" href="logo/my_logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Ocultar la barra superior nativa de Google Translate para mantener el diseño impecable */
    .goog-te-banner-frame,
    .skiptranslate:not(.google-translate-active),
    iframe.goog-te-banner-frame {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
    }
    body {
      top: 0 !important;
      position: static !important;
    }
    #google_translate_element {
      display: none !important;
    }
    .goog-tooltip, .goog-tooltip:hover {
      display: none !important;
    }
    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>

  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'es,en,it,de',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>
  <div id="google_translate_element"></div>
  <app-root></app-root>
</body>
</html>
