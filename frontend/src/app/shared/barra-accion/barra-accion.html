<!-- Barra de reserva (solo movil y tablet). Oculta: inert y fuera de la pantalla. -->
<div role="region" [attr.aria-label]="t().region"
     style="view-transition-name: barra-reserva" class="barra-accion fixed inset-x-0 bottom-0 z-[900] border-t border-linea bg-crema/95 px-3 pt-2 lg:hidden"
     [class.barra-oculta]="!visible()"
     [attr.inert]="visible() ? null : ''">
  <div class="mx-auto grid max-w-[560px] grid-cols-[1fr_auto] gap-2">
    <a [routerLink]="rutaContacto()"
       class="pulsable flex h-12 items-center justify-center gap-2 rounded-full bg-cobre px-6 font-serif text-xs font-semibold uppercase tracking-widest text-white no-underline">
      {{ t().cita }}
      <svg class="h-3.5 w-3.5" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </a>
    <a [href]="whatsapp()" target="_blank" rel="noopener"
       class="pulsable flex h-12 items-center justify-center gap-2 rounded-full border border-tinta/15 bg-white px-4 font-sans text-sm font-medium text-tinta no-underline">
      <svg class="h-5 w-5 text-[#1f7a4d]" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.5h-.01a9.4 9.4 0 0 1-4.79-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.39 9.39 0 0 1-1.44-5.01c0-5.19 4.23-9.42 9.43-9.42a9.37 9.37 0 0 1 6.66 2.76 9.36 9.36 0 0 1 2.76 6.67c0 5.2-4.23 9.42-9.43 9.42zm8.02-17.44A11.28 11.28 0 0 0 12.05.75C5.8.75.72 5.83.72 12.08c0 2 .52 3.95 1.52 5.66L.62 23.25l5.65-1.48a11.3 11.3 0 0 0 5.78 1.47h.01c6.25 0 11.33-5.08 11.33-11.33 0-3.03-1.18-5.87-3.32-8.01z"/></svg>
      {{ t().whatsapp }}
    </a>
  </div>
</div>
