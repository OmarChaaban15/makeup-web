<!-- Aviso de cookies (informativo, ver cookie-banner.ts) -->
@if (visible()) {
  <!--
    Tarjeta pequena flotante: en movil ocupa una franja de unos 90 px en vez
    de un cuarto de pantalla, y en escritorio se queda en la esquina sin
    cubrir el contenido. Queda por debajo de la cabecera (z-1000) para que
    el menu movil abierto la tape y no al reves.
  -->
  <div role="region" [attr.aria-label]="t().region"
       class="aviso-cookies fixed inset-x-3 bottom-3 z-[950] mx-auto max-w-[560px] rounded-2xl border border-linea bg-white/95 px-4 py-3 shadow-[0_8px_30px_rgba(26,26,26,0.12)] sm:inset-x-auto sm:left-5 sm:bottom-5 sm:max-w-[420px] sm:mx-0"
       [class.aviso-saliendo]="ocultando()"
       style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom));">
    <div class="flex items-center gap-3">
      <p class="flex-1 font-sans text-[0.8125rem] leading-snug text-texto-suave">
        {{ t().aviso }}
        <a routerLink="/politica-cookies"
           class="whitespace-nowrap font-medium text-bronce underline underline-offset-2 hover:text-cobre-oscuro">{{ t().mas }}</a>
      </p>
      <button type="button" (click)="cerrar()"
              class="pulsable min-h-11 flex-none cursor-pointer rounded-full bg-cobre px-4 font-serif text-[0.72rem] font-semibold uppercase tracking-[0.12em] text-white hover:bg-cobre-oscuro">
        {{ t().entendido }}
      </button>
    </div>
  </div>
}
