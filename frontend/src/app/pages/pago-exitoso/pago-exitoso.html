<div class="min-h-screen flex items-center justify-center bg-[#f2eae4] px-6 py-24 font-sans">
  <div class="max-w-[480px] w-full rounded-[24px] bg-white p-10 text-center shadow-sm">

    <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-[#c4956a]/10">
      <svg class="h-8 w-8 text-[#c4956a]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 class="font-serif text-[1.9rem] font-light text-[#1a1a1a]">¡Pago completado!</h1>

    <p class="mt-4 font-sans text-[0.88rem] font-light leading-relaxed text-[#666]">
      Gracias por tu compra. Hemos confirmado tu pago
      <span *ngIf="pedidoId">(pedido #{{ pedidoId }})</span>
      y ya tienes acceso a tu curso.
    </p>

    <p class="mt-2 font-sans text-[0.8rem] font-light text-[#888]">
      Te hemos enviado un recibo de la compra por email.
    </p>

    <a routerLink="/mis-cursos"
       class="mt-8 inline-block w-full rounded-full bg-gradient-to-r from-[#c4956a] to-[#a87a52] px-6 py-3.5 text-[0.65rem] font-bold uppercase tracking-widest text-white shadow-[0_6px_24px_rgba(196,149,106,0.35)] transition-all hover:scale-[1.02]">
      Ver mis cursos
    </a>

    <a routerLink="/inicio"
       class="mt-3 inline-block w-full font-sans text-[0.75rem] font-medium text-[#888] hover:text-[#c4956a]">
      Volver al inicio
    </a>

  </div>
</div>
