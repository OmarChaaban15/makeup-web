# ─────────────────────────────────────────────────────────────────────
# Nginx · makeupbyyona.es
#
# Sirve el SPA de Angular como estatico y hace de proxy hacia PHP-FPM
# para /api. Al compartir dominio, el frontend usa rutas relativas y no
# hace falta CORS en el navegador.
#
# Instalacion:
#   sudo cp deploy/nginx/makeupbyyona.es.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/makeupbyyona.es.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# El bloque TLS lo genera certbot:
#   sudo certbot --nginx -d makeupbyyona.es -d www.makeupbyyona.es
# ─────────────────────────────────────────────────────────────────────

# HTTP -> HTTPS (certbot reescribe este bloque al emitir el certificado)
server {
    listen 80;
    listen [::]:80;
    server_name makeupbyyona.es www.makeupbyyona.es;

    # Necesario para la renovacion automatica del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://makeupbyyona.es$request_uri;
    }
}

# www -> dominio principal (una sola URL canonica para SEO)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.makeupbyyona.es;

    ssl_certificate     /etc/letsencrypt/live/makeupbyyona.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeupbyyona.es/privkey.pem;

    return 301 https://makeupbyyona.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name makeupbyyona.es;

    ssl_certificate     /etc/letsencrypt/live/makeupbyyona.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeupbyyona.es/privkey.pem;

    # public/ de Laravel: es lo unico del backend que debe ser accesible.
    root /var/www/makeup-web/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    # ─── Cabeceras de seguridad ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Compresion ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # ─── API (Laravel) ───────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # El webhook de Stripe puede tardar mas que una peticion normal.
        fastcgi_read_timeout 60s;
    }

    # ─── SPA de Angular ──────────────────────────────────────────────
    # El build cae en /var/www/makeup-web/frontend-dist (ver deploy.sh).
    location / {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri $uri/ /index.html;
    }

    # Los ficheros con hash en el nombre (outputHashing: all) se pueden
    # cachear indefinidamente; index.html nunca, o no se veran los deploys.
    location ~* \.(?:js|css|woff2?|svg|ico)$ {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:png|jpe?g|gif|webp|avif|mp4|webm)$ {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /index.html {
        root /var/www/makeup-web/frontend-dist;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ─── Bloqueos ────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(storage/logs|\.env|composer\.(json|lock))$ {
        deny all;
    }

    error_log  /var/log/nginx/makeupbyyona.error.log;
    access_log /var/log/nginx/makeupbyyona.access.log;
}
