# ─────────────────────────────────────────────────────────────────────
# Nginx · makeupbyyona.es
#
# Sirve el SPA de Angular como estatico y hace de proxy hacia PHP-FPM
# para /api. Al compartir dominio, el frontend usa rutas relativas y no
# hace falta CORS en el navegador.
#
# ATENCION: este fichero es la SEGUNDA fase. Declara ssl_certificate, y
# esos ficheros no existen hasta que certbot los emite: si se instala de
# entrada, "nginx -t" falla y certbot no puede validar el dominio.
#
# Primero va makeupbyyona.es.bootstrap.conf (solo HTTP), se emite el
# certificado, y despues se sustituye por este. Paso 7 de deploy/README.md.
# ─────────────────────────────────────────────────────────────────────

# HTTP -> HTTPS (certbot reescribe este bloque al emitir el certificado)
server {
    listen 80;
    listen [::]:80;
    server_name makeupbyyona.es www.makeupbyyona.es;

    # Necesario para la renovacion automatica del certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://makeupbyyona.es$request_uri;
    }
}

# www -> dominio principal (una sola URL canonica para SEO)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.makeupbyyona.es;

    ssl_certificate     /etc/letsencrypt/live/makeupbyyona.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeupbyyona.es/privkey.pem;

    return 301 https://makeupbyyona.es$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name makeupbyyona.es;

    ssl_certificate     /etc/letsencrypt/live/makeupbyyona.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeupbyyona.es/privkey.pem;

    # public/ de Laravel: es lo unico del backend que debe ser accesible.
    root /var/www/makeup-web/backend/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;

    # ─── Cabeceras de seguridad ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Compresion ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # ─── API (Laravel) ───────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # El webhook de Stripe puede tardar mas que una peticion normal.
        fastcgi_read_timeout 60s;
    }

    # ─── SPA de Angular ──────────────────────────────────────────────
    # El build cae en /var/www/makeup-web/frontend-dist (ver deploy.sh).
    #
    # OJO con las cabeceras: en Nginx, en cuanto un "location" declara su
    # propio add_header, deja de heredar TODOS los del bloque server. Por
    # eso los bloques de abajo repiten las cabeceras de seguridad; si se
    # quitan de ahi, los estaticos se sirven sin ellas.
    location / {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri $uri/ /index.html;

        # El index.html no se cachea nunca: es lo que apunta a los bundles
        # con hash, y si se queda pegado no se ven los despliegues. Va aqui
        # y no solo en "location = /index.html" porque las rutas profundas
        # del SPA (/cursos, /mis-cursos...) llegan por este try_files.
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Solo JS/CSS/fuentes llevan hash en el nombre (outputHashing: all):
    # cambian de nombre en cada build, asi que "immutable" es seguro.
    # El favicon, el logo y las fotos NO llevan hash (se copian tal cual
    # desde public/), por eso van en el bloque siguiente con cache mas
    # corta: con un ano inmutable no habria forma de actualizarlos.
    location ~* \.(?:js|css|woff2?)$ {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri =404;
        expires 1y;
        access_log off;

        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Fotografia y video: se sirven integros y con cache larga. Nginx
    # atiende peticiones por rango de serie, que es lo que permite empezar
    # a reproducir el video sin haberlo descargado entero.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|avif|mp4|webm)$ {
        root /var/www/makeup-web/frontend-dist;
        try_files $uri =404;
        expires 30d;
        access_log off;

        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # ─── Bloqueos ────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* /(storage/logs|\.env|composer\.(json|lock))$ {
        deny all;
    }

    error_log  /var/log/nginx/makeupbyyona.error.log;
    access_log /var/log/nginx/makeupbyyona.access.log;
}
