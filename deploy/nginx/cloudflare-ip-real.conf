# ─────────────────────────────────────────────────────────────────────
# Nginx · IP real de la visita detras de Cloudflare
#
# Con el proxy de Cloudflare activo (nube naranja), todas las conexiones
# llegan desde IPs de Cloudflare. Sin esto, Laravel ve esa IP como la del
# cliente y los limitadores por IP (login: 5/min, correo: 3/min) meten a
# todas las visitas en el mismo saco: cinco intentos de login fallidos de
# cualquiera bloquean a todo el mundo. Los logs tampoco servirian.
#
# Solo se acepta CF-Connecting-IP cuando la conexion viene de un rango de
# Cloudflare: si alguien ataca la IP del servidor directamente, la cabecera
# se ignora y no puede falsear su IP.
#
# Va en el contexto http, no dentro del server:
#   sudo cp deploy/nginx/cloudflare-ip-real.conf /etc/nginx/conf.d/
#
# Los rangos cambian muy de vez en cuando. deploy/cloudflare-ips.sh
# regenera este fichero desde https://www.cloudflare.com/ips-v4 e ips-v6.
# Rangos copiados el 04/11/2026.
# ─────────────────────────────────────────────────────────────────────

