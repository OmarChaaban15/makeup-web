# ─────────────────────────────────────────────────────────────────────
# Nginx · makeupbyyona.es · configuración PROVISIONAL (solo HTTP)
#
# Existe únicamente para poder emitir el primer certificado.
#
# El fichero definitivo (makeupbyyona.es.conf) declara ssl_certificate
# apuntando a /etc/letsencrypt/live/..., que no existe todavía: con él
# puesto, "nginx -t" falla, nginx no arranca y certbot no puede validar
# el dominio. De ahí este paso intermedio.
#
# Uso:
#   sudo cp deploy/nginx/makeupbyyona.es.bootstrap.conf /etc/nginx/sites-available/makeupbyyona.es.conf
#   sudo ln -s /etc/nginx/sites-available/makeupbyyona.es.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
#   sudo certbot certonly --webroot -w /var/www/certbot \
#        -d makeupbyyona.es -d www.makeupbyyona.es
#
# Y una vez emitido, se sustituye por el definitivo:
#   sudo cp deploy/nginx/makeupbyyona.es.conf /etc/nginx/sites-available/makeupbyyona.es.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name makeupbyyona.es www.makeupbyyona.es;

    # Validación del dominio de Let's Encrypt.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Marcador mientras no hay HTTPS. Sirve además para comprobar que el
    # DNS ya apunta aquí antes de pedir el certificado.
    location / {
        return 200 "makeupbyyona.es - pendiente de certificado TLS\n";
        add_header Content-Type text/plain;
    }
}
